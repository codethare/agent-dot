import { execFile } from "node:child_process";
import { randomUUID } from "node:crypto";
import type { ExtensionAPI } from "@earendil-works/pi-coding-agent";

export default function (pi: ExtensionAPI) {
  const pane = process.env.TMUX_PANE;
    if (!pane) return;                       // no-op

  let base: string | null = null;
  let idle = true;
  let children = 0;                          // last known active pi-subagents runs
  const tmux = (...args: string[]) => execFile("tmux", args, () => {});
  const name = () =>
    new Promise<string | null>((res) =>
      execFile("tmux", ["display-message", "-t", pane, "-p", "#{window_name}"], (_e, o) => res(o?.trim() || null)));

  const set = async (icon: string) => {
    const n = await name();
    if (!n) return;
    if (base === null) base = n.replace(/^[▶✔⚠✘🔄⏳🟡✅❌ ]+/, "").trim();
    tmux("rename-window", "-t", pane, `${icon} ${base}`);
    // also publish to the statusline tab format (statusline.conf renders #{@pi-agent-status-marker})
    tmux("set-window-option", "-t", pane, "@pi-agent-status-marker", icon);
  };
  const restore = () => { if (base !== null) { tmux("rename-window", "-t", pane, base); tmux("set-window-option", "-t", pane, "@pi-agent-status-marker", ""); base = null; } };

  // Subagents run in subprocesses, so pi settles idle while they still work.
  // Ask pi-subagents for the authoritative active-fleet count via its RPC bus.
  const refresh = () =>
    new Promise<void>((res) => {
      const requestId = randomUUID();
      const done = (n: number) => { clearTimeout(timer); unsubscribe(); if (n >= 0) children = n; void set(children > 0 || !idle ? "🔄" : "✅"); res(); };
      const timer = setTimeout(() => done(-1), 2000);   // no reply → keep last known
      const unsubscribe = pi.events.on(`subagents:rpc:v1:reply:${requestId}`, (reply: unknown) => {
        const r = reply as { success?: boolean; data?: { fleet?: { totalActive?: number } } };
        done(r?.success && r.data?.fleet ? r.data.fleet.totalActive ?? 0 : -1);
      });
      pi.events.emit("subagents:rpc:v1:request", { version: 1, requestId, method: "status", params: {} });
    });

  pi.on("agent_start", () => { idle = false; void set("🔄"); });
  pi.on("agent_settled", (_e, ctx) => { idle = ctx.isIdle(); if (idle) void refresh(); });
  pi.events.on("subagent:async-started", () => void set("🔄"));
  pi.events.on("subagent:async-complete", () => void refresh());
  pi.on("session_shutdown", restore);      //  restore tab name
}


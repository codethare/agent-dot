# vim: ft=tmux
# Simplified statusline — Solarized colors

set -g status "on"
set -g status-interval 1
set -g status-justify "left"
set -g status-style "fg=#586e75,bg=#073642"

set -g status-left-length "60"
set -g status-right-length "100"

# Left: session:window.pane → path
set -g status-left "#[fg=#073642,bg=#eee8d5,bold] #S:#I.#P #[fg=#eee8d5,bg=#93a1a1]#[fg=#15161E,bg=#93a1a1] #{b:pane_current_path} "

# Right: user@host   time
set -g status-right "#[fg=#93a1a1] #(whoami)@#h #[fg=#586e75] %H:%M "

# Window tabs
setw -g window-status-format "#[fg=#839496,bg=#002b36] #I:#{b:pane_current_path} "
setw -g window-status-current-format "#[fg=#b58900,bg=#eee8d5] #I:#{b:pane_current_path} "
setw -g window-status-separator ""
setw -g window-status-activity-style "underscore,fg=#839496,bg=#073642"
